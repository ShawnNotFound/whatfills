name: tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Build and install
        run: python -m pip install . pytest
      - name: Run the tests
        run: python -m pytest -q

  oldest-python:
    # The oldest Python we support, as shipped by RHEL 9 and its rebuilds.
    name: Python 3.9
    runs-on: ubuntu-latest
    container: python:3.9
    steps:
      - uses: actions/checkout@v5
      - name: Build and install
        run: python -m pip install . pytest
      - name: Run the tests
        run: python -m pytest -q
